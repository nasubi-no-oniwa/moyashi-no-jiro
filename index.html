.big{margin-top:20px;font-family:var(--disp);font-size:22px;background:var(--ink);color:var(--sign);border:0;border-radius:12px;padding:13px 28px;cursor:pointer;width:100%;letter-spacing:.06em}
.big.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px;font-size:17px;padding:9px}
.res-rank{font-family:var(--disp);font-size:clamp(28px,9vw,38px);margin:4px 0 0;line-height:1.1}
.res-line{display:flex;justify-content:center;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:14px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.res-line b{font-family:var(--disp);font-weight:400;font-size:26px}
.res-score{margin-top:6px;font-family:var(--disp);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.res-score small{font-family:var(--body);font-weight:900;font-size:16px;margin-left:4px}
.res-note{margin:12px 0 0;font-weight:700;font-size:14px}
.sign.fail{background:#e7ddc6}
.sign.fail h1{color:var(--chili)}
.entry{display:flex;gap:8px;margin-top:16px}
.entry input{flex:1;min-width:0;font:700 16px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:#fffaf0;color:var(--ink)}

.tabs{display:flex;gap:4px;justify-content:center;margin-top:12px}
.tabs button{font:900 14px var(--body);border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}

.rlist .nm{font-weight:900;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nm small{display:block;font-weight:700;font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.rlist .sc{font-family:var(--disp);font-size:17px;font-variant-numeric:tabular-nums}

<div id="app">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="hud" hidden>
    <div class="stat"><span data-i="statH">高さ（ふちから）</span><b id="sh">0.0<small>cm</small></b></div>
    <div class="stat"><span data-i="statW">重さ</span><b id="sw">0<small>g</small></b></div>
    <div class="stat"><span data-i="statS">点数</span><b id="ss">0</b></div>
  </div>
  <div id="hint" hidden></div>
  <div id="gauge" hidden></div>
  <div id="gtext" hidden></div>
  <div id="bar" hidden>
    <div class="tools" role="group" aria-label="道具">
      <button id="tTong" aria-pressed="true" data-i="tong">トング</button>
      <button id="tHand" aria-pressed="false" data-i="hand">素手</button>
    </div>
    <button id="viewBtn" class="viewbtn" aria-label="視点を切りかえる"><span data-i="view">視点</span><b id="viewName">正面</b></button>
    <button id="serve" disabled data-i="serve">出す</button>
  </div>
  <div id="flash"></div>

  <div class="overlay" id="title">
    <div class="sign">
      <div class="stamp" data-ih="stamp">ヤサイ<br>マシ</div>
      <h1 data-ih="titleBr">もやしの<br>次郎</h1>
      <p class="sub" data-i="sub">ヤサイ、どこまで盛れる？</p>
      <ul class="how">
        <li><b>1</b><span data-i="how1">小皿を長押しでつかむ。長く押すほどたくさん</span></li>
        <li><b>2</b><span data-i="how2">丼の上で指をはなして盛る</span></li>
        <li><b>3</b><span data-i="how3">「出す」でカウンター越しにお客さんの前へ</span></li>
        <li><b>4</b><span data-i="how4">落としたらちゃぶ台返し。点数は 高さ×重さ</span></li>
      </ul>
      <button class="big" id="start" data-i="start">店に立つ</button>
      <button class="big alt" id="titleRank" data-i="rankBtn">ランキング</button>
      <div class="langs" role="group" aria-label="Language"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">繁中</button><button data-lang="ko">한국어</button></div>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="sign" id="resCard">
      <p class="sub" id="resHead">へい、おまち</p>
      <p class="res-rank" id="resRank"></p>
      <div class="res-line" id="resLine"></div>
      <div class="res-score" id="resScore"></div>
      <p class="res-note" id="resNote"></p>
      <div id="entryBox" hidden>
        <div class="entry"><input id="name" maxlength="12" placeholder="名前（12文字まで）" data-ip="namePh" autocomplete="nickname"><button id="send" data-i="send">登録</button></div>
        <p class="send-msg" id="sendMsg"></p>
      </div>
      <button class="big" id="again">もう一杯</button>
      <button class="big alt" id="resRankBtn" data-i="seeRank">ランキングを見る</button>
    </div>
  </div>
  <div class="overlay" id="rank" hidden>
    <div class="sign">
      <p class="res-rank" style="margin:0" data-i="rankTitle">盛り番付</p>
      <div class="tabs" role="group" aria-label="期間"><button id="tabDay" aria-pressed="true" data-i="today">今日</button><button id="tabAll" aria-pressed="false" data-i="allTime">全期間</button></div>
      <ol class="rlist" id="rlist"></ol>
      <button class="big alt" id="rankClose" data-i="close">とじる</button>
    </div>
  </div>
  <div id="rpBar" hidden><button id="rpBack" data-i="back">もどる</button></div>
  <div id="loading">仕込み中…</div>
</div>

function makeTube(len, rad, bend) {
  const seg = 10, radial = 6, pos = [], idx = [];
  const ph = rnd() * 6;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, y = (t - .5) * len;
    const cx = Math.sin(t * Math.PI) * bend, cz = Math.sin(t * Math.PI * 1.3 + ph) * bend * .5;
    const r = rad * (t < .25 ? .45 + t * 2.2 : 1);
    for (let k = 0; k < radial; k++) {
      const a = k / radial * Math.PI * 2;
      pos.push(cx + Math.cos(a) * r, y, cz + Math.sin(a) * r);
    }
  }
  for (let i = 0; i < seg; i++) for (let k = 0; k < radial; k++) {
    const a = i * radial + k, b = i * radial + (k + 1) % radial, c = a + radial, d = b + radial;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

  if (t < rp.buildEnd) {
    for (const pc of clumps) {
      if (t < pc.T0) continue;
      if (pc.hide) { pc.hide = false; if (t - pc.T0 < .1) sfxDrop(); }
      const e = clamp((t - pc.T0) / .25, 0, 1);
      setPiece(pc, base.set(0, (1 - e) * (1 - e) * 7, 0), pc.rp.s1);
    }
  } else if (t < rp.buildEnd + rp.carryDur) {
    camGoal = 'carry';
    const k = (t - rp.buildEnd) * 15, i = Math.floor(k), f = k - i;
    const a = rp.carry[Math.min(i, rp.carry.length - 1)], b = rp.carry[Math.min(i + 1, rp.carry.length - 1)];
    base.copy(path.getPointAt(clamp(a + (b - a) * f, 0, 1)));
    for (const pc of clumps) { pc.hide = false; setPiece(pc, base, pc.rp.s1); }
  } else {
    base.copy(path.getPointAt(1));
    const e = clamp((t - rp.buildEnd - rp.carryDur) / .6, 0, 1);
    for (const pc of clumps) { pc.hide = false; setPiece(pc, base, pc.rp.s1, pc.rp.s2, e); }
    if (e >= 1 && !rp.done) {
      rp.done = true; cust.state = 'happy'; cust.t = 0; sfxThump(.6);
      const en = rp.entry;
      setTimeout(() => { if (phase === 'replay' && rp && rp.entry === en) showReplayEnd(en); }, 1500);
    }
  }
  bowlBody.position.set(base.x, base.y, base.z);
  const m = measure();
  $('#sh').innerHTML = `${m.h.toFixed(1)}<small>cm</small>`;
  $('#sw').innerHTML = `${Math.round(m.g)}<small>g</small>`;
  $('#ss').textContent = m.score.toLocaleString();
}
function showReplayEnd(en) {
  $('#hud').hidden = true; $('#rpBar').hidden = true; setHint('');
  $('#resCard').classList.remove('fail');
  $('#resHead').textContent = tr('rpHead', { n: en.n });
  $('#resRank').textContent = rankName(en.s);
  $('#resLine').innerHTML = tr('line', { h: (en.h / 10).toFixed(1), g: en.g });
  $('#resScore').innerHTML = `${en.s.toLocaleString()}<small>${tr('pts')}</small>`;
  $('#resNote').textContent = '';
  $('#entryBox').hidden = true; $('#again').textContent = tr('againRp'); $('#resRankBtn').hidden = false;
  $('#result').hidden = false; resultMode = 'replay'; rankFrom = 'replay';
}
$('#rpBack').onclick = () => { clearScene(); resetCust(); phase = 'title'; camGoal = 'title'; $('#hud').hidden = true; setHint(''); showRank(rankKind); };

/* 確認用 */
window.__moya = {
  get phase() { return phase; }, measure, clumps, world, bowlBody, carry, startGame,
  drop(type, tl, f, x, z) { const h = newHeld(type, tl); growHeld(h, Math.ceil(h.nmax * f)); cacheSpheres(); h.pos.set(x, topAt(x, z, h.r) + h.half + .6, z); dropHeld(h); cacheSpheres(); return h; },
  sim(sec) { const n = Math.round(sec * 90); for (let i = 0; i < n; i++) { world.step(1 / 90); cacheSpheres(); logic(1 / 90); } },
  serve() { $('#serve').disabled = false; $('#serve').onclick(); },
  view(v) { camGoal = v; },
  pause(b) { paused = b; },
  frame(dt, mult = 1) { const n = Math.max(1, Math.round(dt * mult * 90)); for (let i = 0; i < n; i++) world.step(1 / 90); cacheSpheres(); logic(dt * mult); render(dt); },
  pvHold(type, n, x, z) { held = newHeld(type, 'tong'); growHeld(held, n); held.grow = false; held.fine = true; held.pv = true; held.aim = new THREE.Vector3(x, 0, z); held.lx = 0; held.ly = 0; ptr = { id: -1, x: 0, y: 0, lift: 0 }; },
  pvAim(x, z) { if (held) held.aim.set(x, 0, z); },
  pvRelease() { if (held && held.over) dropHeld(held); held = null; ptr = null; placeTool(null, 0, false); },
  setNoFail(v) { noFail = v; },
  lowq(px) { key.shadow.mapSize.set(1024, 1024); if (key.shadow.map) { key.shadow.map.dispose(); key.shadow.map = null; } renderer.shadowMap.type = THREE.PCFShadowMap; renderer.setPixelRatio(px || 1); resize(); },
  timeRender(n) { const t = performance.now(); for (let i = 0; i < n; i++) render(1 / 24); renderer.getContext().finish(); return (performance.now() - t) / n; },
  setPT(v) { carry.pT = v; },
  rankName(s) { return rankName(s); },
  setLang(l) { LANG = l; applyLang(); },
  get final() { return final; },
  replayLocal() { startReplay(decRec(final.rec), { n: 'テスト', s: final.score, h: Math.round(final.h * 10), g: Math.round(final.g) }); },
  topAt(x, z) { cacheSpheres(); return topAt(x, z, 2); },
  scr(x, y, z) { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; },
  snap(n = 40) { for (let i = 0; i < n; i++) { cacheSpheres(); render(1 / 30); } },
  click(id) { document.getElementById(id).click(); },
};
</script>
