<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b120c">
<meta name="description" content="ラーメンにもやしをどこまで盛れるか。盛って、カウンター越しに運べ。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>もやしの次郎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 夜のラーメン屋のカウンター。画面いっぱいの3D、上に数字、下に操作、看板色の札 */
:root{
  --ink:#1b120c;
  --ink2:#2a1d14;
  --paper:#f6ecd2;
  --sign:#ecc94b;
  --soy:#5a2a12;
  --chili:#c8321e;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;justify-content:center;pointer-events:none}
.stat{background:rgba(27,18,12,.74);border:1px solid rgba(246,236,210,.16);border-radius:10px;padding:5px 10px 6px;min-width:78px;text-align:center}
.stat span{display:block;font-size:11px;letter-spacing:.1em;opacity:.75;font-weight:700}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--sign)}
.stat b small{font-family:var(--body);font-size:12px;font-weight:700;margin-left:2px;color:var(--paper)}
#bar{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
#bar>*{pointer-events:auto}
.tools{display:flex;gap:2px;background:rgba(27,18,12,.82);border-radius:999px;padding:4px;border:1px solid rgba(246,236,210,.2)}
.tools button{font:900 15px var(--body);color:var(--paper);background:transparent;border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
#serve{font-family:var(--disp);font-size:22px;background:var(--chili);color:#fff;border:0;border-radius:14px;padding:12px 22px;box-shadow:0 4px 0 #7d1b0f;cursor:pointer;letter-spacing:.06em}
#serve:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1b0f}
#serve:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 78px);text-align:center;font-weight:900;font-size:15px;text-shadow:0 1px 4px #000,0 0 12px #000;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-wrap:balance}
.dlabel{position:absolute;transform:translate(-50%,0);font-weight:900;font-size:13px;background:var(--paper);color:var(--ink);padding:2px 9px;border-radius:5px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#gauge{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;pointer-events:none;--p:0;background:conic-gradient(var(--sign) calc(var(--p) * 1turn),rgba(246,236,210,.18) 0);-webkit-mask:radial-gradient(circle,transparent 21px,#000 22px);mask:radial-gradient(circle,transparent 21px,#000 22px)}
#gtext{position:absolute;transform:translate(-50%,-150%);font-weight:900;font-size:13px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,12,8,.62);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.sign{position:relative;background:var(--sign);color:var(--ink);border-radius:6px;padding:26px 22px 22px;width:min(100%,360px);box-shadow:0 0 0 6px var(--ink),0 0 0 8px var(--sign),0 18px 40px rgba(0,0,0,.6);text-align:center}
.sign h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,12vw,52px);line-height:1.05;margin:0;letter-spacing:.02em;text-wrap:balance}
.sign .sub{font-weight:900;font-size:16px;margin:10px 0 0}
.stamp{position:absolute;top:-22px;right:6px;width:64px;height:64px;border-radius:50%;background:var(--chili);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:15px;line-height:1.05;transform:rotate(12deg);box-shadow:0 3px 0 #7d1b0f}
.how{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px;text-align:left;font-weight:700;font-size:14px}
.how li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.how li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--sign);font-size:12px}
.big{margin-top:20px;font-family:var(--disp);font-size:22px;background:var(--ink);color:var(--sign);border:0;border-radius:12px;padding:13px 28px;cursor:pointer;width:100%;letter-spacing:.06em}
.big.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px;font-size:17px;padding:9px}
.res-rank{font-family:var(--disp);font-size:clamp(28px,9vw,38px);margin:4px 0 0;line-height:1.1}
.res-line{display:flex;justify-content:center;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:14px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.res-line b{font-family:var(--disp);font-weight:400;font-size:26px}
.res-score{margin-top:6px;font-family:var(--disp);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.res-score small{font-family:var(--body);font-weight:900;font-size:16px;margin-left:4px}
.res-note{margin:12px 0 0;font-weight:700;font-size:14px}
.sign.fail{background:#e7ddc6}
.sign.fail h1{color:var(--chili)}
.entry{display:flex;gap:8px;margin-top:16px}
.entry input{flex:1;min-width:0;font:700 16px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:#fffaf0;color:var(--ink)}
.entry button{font:900 15px var(--body);background:var(--ink);color:var(--sign);border:0;border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.entry button:disabled{opacity:.5}
.send-msg{margin:8px 0 0;font-weight:700;font-size:13px;min-height:1.2em}
.tabs{display:flex;gap:4px;justify-content:center;margin-top:12px}
.tabs button{font:900 14px var(--body);border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--sign)}
.rlist{list-style:none;margin:12px 0 0;padding:0;max-height:min(52vh,420px);overflow-y:auto;text-align:left;border-top:2px solid var(--ink)}
.rlist li{display:grid;grid-template-columns:28px 1fr auto 34px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(27,18,12,.25)}
.rlist .no{font-family:var(--disp);font-size:16px;text-align:center}
.rlist .nm{font-weight:900;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nm small{display:block;font-weight:700;font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.rlist .sc{font-family:var(--disp);font-size:17px;font-variant-numeric:tabular-nums}
.rlist .pl{width:32px;height:32px;border-radius:50%;border:0;background:var(--chili);color:#fff;font-size:12px;cursor:pointer}
.rlist .me .nm{color:var(--chili)}
.rempty{padding:18px 0;font-weight:700;text-align:center}
#rpBar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#rpBar button{font:900 16px var(--body);background:rgba(27,18,12,.85);color:var(--paper);border:1px solid rgba(246,236,210,.3);border-radius:999px;padding:10px 22px;cursor:pointer}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--paper)}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="hud" hidden>
    <div class="stat"><span>高さ（ふちから）</span><b id="sh">0.0<small>cm</small></b></div>
    <div class="stat"><span>重さ</span><b id="sw">0<small>g</small></b></div>
    <div class="stat"><span>点数</span><b id="ss">0</b></div>
  </div>
  <div id="hint" hidden></div>
  <div id="gauge" hidden></div>
  <div id="gtext" hidden></div>
  <div id="bar" hidden>
    <div class="tools" role="group" aria-label="道具">
      <button id="tTong" aria-pressed="true">トング</button>
      <button id="tHand" aria-pressed="false">素手</button>
    </div>
    <button id="serve" disabled>出す</button>
  </div>
  <div id="flash"></div>

  <div class="overlay" id="title">
    <div class="sign">
      <div class="stamp">ヤサイ<br>マシ</div>
      <h1>もやしの<br>次郎</h1>
      <p class="sub">ヤサイ、どこまで盛れる？</p>
      <ul class="how">
        <li><b>1</b><span>小皿を長押しでつかむ。長く押すほどたくさん</span></li>
        <li><b>2</b><span>丼の上で指をはなして盛る</span></li>
        <li><b>3</b><span>「出す」でカウンター越しにお客さんの前へ</span></li>
        <li><b>4</b><span>落としたらちゃぶ台返し。点数は 高さ×重さ</span></li>
      </ul>
      <button class="big" id="start">店に立つ</button>
      <button class="big alt" id="titleRank">ランキング</button>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="sign" id="resCard">
      <p class="sub" id="resHead">へい、おまち</p>
      <p class="res-rank" id="resRank"></p>
      <div class="res-line" id="resLine"></div>
      <div class="res-score" id="resScore"></div>
      <p class="res-note" id="resNote"></p>
      <div id="entryBox" hidden>
        <div class="entry"><input id="name" maxlength="12" placeholder="名前（12文字まで）" autocomplete="nickname"><button id="send">登録</button></div>
        <p class="send-msg" id="sendMsg"></p>
      </div>
      <button class="big" id="again">もう一杯</button>
      <button class="big alt" id="resRankBtn">ランキングを見る</button>
    </div>
  </div>
  <div class="overlay" id="rank" hidden>
    <div class="sign">
      <p class="res-rank" style="margin:0">盛り番付</p>
      <div class="tabs" role="group" aria-label="期間"><button id="tabDay" aria-pressed="true">今日</button><button id="tabAll" aria-pressed="false">全期間</button></div>
      <ol class="rlist" id="rlist"></ol>
      <button class="big alt" id="rankClose">とじる</button>
    </div>
  </div>
  <div id="rpBar" hidden><button id="rpBack">もどる</button></div>
  <div id="loading">仕込み中…</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

const $ = s => document.querySelector(s);
const rnd = Math.random, R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===================== 描画の準備 ===================== */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17110d);
scene.fog = new THREE.Fog(0x17110d, 190, 360);
const camera = new THREE.PerspectiveCamera(50, 1, 1, 900);

// 映り込み用の簡単な店内
{
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  es.background = new THREE.Color(0x2c2119);
  const lamp = new THREE.MeshBasicMaterial({ color: 0xfff0d6 });
  for (let i = -2; i <= 2; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 60), lamp);
    m.position.set(i * 26, 40, 0); es.add(m);
  }
  const warm = new THREE.MeshBasicMaterial({ color: 0x8a5a2c });
  const w = new THREE.Mesh(new THREE.BoxGeometry(200, 30, 2), warm); w.position.set(0, 0, -60); es.add(w);
  scene.environment = pm.fromScene(es, 0.04).texture;
}

scene.add(new THREE.HemisphereLight(0xffe7c6, 0x2a1b12, 0.55));
const key = new THREE.DirectionalLight(0xfff0da, 2.4);
key.position.set(-40, 140, -10);
key.target.position.set(0, 0, 25);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -75, right: 75, top: 85, bottom: -60, near: 20, far: 320 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.06;
scene.add(key, key.target);
const pend = new THREE.PointLight(0xffc98c, 0.9, 0, 0);
pend.position.set(10, 70, 30);
scene.add(pend);

/* ===================== 質感 ===================== */
function canvasTex(w, h, draw, { srgb = true, repeat } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#8c5b33'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 240; i++) {
    const y = rnd() * h;
    g.strokeStyle = `rgba(${rnd() < .55 ? '58,30,12' : '178,128,76'},${R(.04, .22)})`;
    g.lineWidth = R(.6, 3.2); g.beginPath(); g.moveTo(0, y);
    const ph = rnd() * 9, amp = R(1, 5);
    for (let x = 0; x <= w; x += 24) g.lineTo(x, y + Math.sin(x * .013 + ph) * amp);
    g.stroke();
  }
}, { repeat: [3, 1] });
const steelTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#9a9c9f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '255,255,255' : '0,0,0'},${R(.02, .08)})`; g.fillRect(0, rnd() * h, w, R(.5, 1.5)); }
}, { repeat: [4, 2] });
const tileTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b2a1f'; g.fillRect(0, 0, w, h);
  const s = 32;
  for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) {
    g.fillStyle = `hsl(${R(18, 26)},${R(28, 38)}%,${R(28, 34)}%)`; g.fillRect(x + 1.5, y + 1.5, s - 3, s - 3);
  }
}, { repeat: [10, 4] });

const M = {
  wood: new THREE.MeshStandardMaterial({ map: woodTex, roughness: .55, metalness: 0 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x3c2516, roughness: .7 }),
  steel: new THREE.MeshStandardMaterial({ map: steelTex, roughness: .32, metalness: .85 }),
  tile: new THREE.MeshStandardMaterial({ map: tileTex, roughness: .4 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x1e1612, roughness: .9 }),
  body: new THREE.MeshStandardMaterial({ color: 0xd2d1cc, roughness: .3, metalness: 0 }),
  strand: new THREE.MeshStandardMaterial({ color: 0xf4f0e0, roughness: .36, metalness: 0, emissive: 0x24221a }),
  head: new THREE.MeshStandardMaterial({ color: 0xe0c25a, roughness: .5 }),
  tong: new THREE.MeshStandardMaterial({ color: 0xc9cbcf, roughness: .22, metalness: .95 }),
};

/* ===================== 店 ===================== */
const KITCH_TOP = 0, LEDGE_TOP = 16, CUST_TOP = 8;
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
box(150, 6, 54, M.steel, 0, -3, -9);           // 厨房の台 z -36..18
box(150, 70, 12, M.woodDark, 0, -19, 24);      // 段の板 z 18..30
box(150, 2.4, 13, M.wood, 0, LEDGE_TOP - 1.2, 24); // 段の天板
box(150, 6, 52, M.wood, 0, CUST_TOP - 3, 56);  // お客さんの台 z 30..82
box(150, 80, 3, M.woodDark, 0, -37, 81);       // 台の下
{
  const f = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), M.floor);
  f.rotation.x = -Math.PI / 2; f.position.y = -78; f.receiveShadow = true; scene.add(f);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(400, 220), M.tile);
  wall.position.set(0, 20, 140); wall.rotation.y = Math.PI; scene.add(wall);
  // 壁の貼り紙（文字ではなく筆の跡だけ）
  for (let i = 0; i < 7; i++) {
    const t = canvasTex(64, 200, (g, w, h) => {
      g.fillStyle = '#efe4c8'; g.fillRect(0, 0, w, h);
      g.fillStyle = 'rgba(30,20,12,.85)';
      let y = 18; while (y < h - 30) { const s = R(14, 24); g.fillRect(w / 2 - R(6, 14), y, R(12, 26), s * .55); y += s + 4; }
      g.fillStyle = '#b52a18'; g.fillRect(8, h - 26, w - 16, 14);
    });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(13, 40), new THREE.MeshStandardMaterial({ map: t, roughness: .9 }));
    p.position.set(-66 + i * 22, 64 + R(-2, 2), 139); p.rotation.y = Math.PI; p.rotation.z = R(-.03, .03); scene.add(p);
  }
}

/* ===================== もやしの形 ===================== */
// 先が細い管を自前でつくる
function makeTube(len, rad, bend) {
  const seg = 10, radial = 6, pos = [], idx = [];
  const ph = rnd() * 6;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, y = (t - .5) * len;
    const cx = Math.sin(t * Math.PI) * bend, cz = Math.sin(t * Math.PI * 1.3 + ph) * bend * .5;
    const r = rad * (t < .25 ? .45 + t * 2.2 : 1);
    for (let k = 0; k < radial; k++) {
      const a = k / radial * Math.PI * 2;
      pos.push(cx + Math.cos(a) * r, y, cz + Math.sin(a) * r);
    }
  }
  for (let i = 0; i < seg; i++) for (let k = 0; k < radial; k++) {
    const a = i * radial + k, b = i * radial + (k + 1) % radial, c = a + radial, d = b + radial;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
// もやしは「数本ずつの小さな束（かけら）」で物理を動かす。トングは束が多く、素手は少ない
const TYPES = {
  long:  { name: '長い',  L: 7.8, Lv: .7, rad: .19, gram: 1.5, hx: 3.8, hy: .55, hz: .7,  per: 5, tong: 5, hand: 2, align: .9,  glue: 520 },
  mid:   { name: 'ふつう', L: 5.4, Lv: .5, rad: .18, gram: 1.0, hx: 2.6, hy: .6,  hz: .8,  per: 5, tong: 5, hand: 2, align: .75, glue: 480 },
  short: { name: '短い',  L: 3.1, Lv: .3, rad: .17, gram: .55, hx: 1.5, hy: .65, hz: .9,  per: 6, tong: 6, hand: 2, align: .45, glue: 420 },
};
const MAXI = 7000;
const strandMesh = {}, headMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(.3, 8, 6).scale(1, 1.35, 1), M.head, MAXI);
headMesh.castShadow = true; headMesh.receiveShadow = true; headMesh.frustumCulled = false;
headMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(headMesh);
for (const k in TYPES) {
  const T = TYPES[k];
  const im = new THREE.InstancedMesh(makeTube(T.L, T.rad, T.L * .07), M.strand, MAXI);

  if (phase !== 'title') stepPhysics(dt);

  render(dt);
  requestAnimationFrame(frame);
}
function logic(dt) {
  if (phase === 'build' || phase === 'carry' || phase === 'judge') gameT += dt;
  if (phase === 'carry') { rec.acc += dt; while (rec.acc >= 1 / 15) { rec.acc -= 1 / 15; rec.carry.push(carry.pT); } }
  if (phase === 'replay') { updateReplay(dt); return; }
  checkFall(dt);
  if (phase === 'judge') {
    carry.tJudge += dt;
    let mv = 0; for (const cl of clumps) mv = Math.max(mv, cl.body.velocity.length());
    carry.settle = mv < 3 ? carry.settle + dt : 0;
    if (carry.tJudge > 1.0 && (carry.settle > .5 || carry.tJudge > 3.5)) { final = measure(); snapPieces('s2'); final.rec = encRec(); success(); }
  }
  if (phase === 'build') $('#serve').disabled = !clumps.length || !!held;
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0 && phase === 'build') setHint(clumps.length ? '' : '小皿を長押しでつかんで、丼の上ではなす'); }
  if (phase === 'build' || phase === 'carry' || phase === 'judge') {
    const m = measure();
    $('#sh').innerHTML = `${m.h.toFixed(1)}<small>cm</small>`;
    $('#sw').innerHTML = `${Math.round(m.g)}<small>g</small>`;
    $('#ss').textContent = m.score.toLocaleString();
  }
}
const tmpM = new THREE.Matrix4();
function render(dt) {
  // カメラ
  const v = VIEWS[camGoal], k = Math.min(1, dt * 3);
  camera.position.lerp(v.pos, k); camLook.lerp(v.look, k);
  camera.fov += (fitFov(v) - camera.fov) * k; camera.updateProjectionMatrix();
  camera.lookAt(camLook);
  // 丼
  bowlG.position.set(bowlBody.position.x, bowlBody.position.y, bowlBody.position.z);
  bowlG.quaternion.set(bowlBody.quaternion.x, bowlBody.quaternion.y, bowlBody.quaternion.z, bowlBody.quaternion.w);
  // もやし
  const cnt = { long: 0, mid: 0, short: 0 }; let hc = 0;
  const put = (pc, W) => {
    const im = strandMesh[pc.type];
    for (let i = 0; i < pc.n; i++) {
      if (cnt[pc.type] >= MAXI || hc >= MAXI) return;
      im.setMatrixAt(cnt[pc.type]++, tmpM.multiplyMatrices(W, pc.ms[i]));
      headMesh.setMatrixAt(hc++, tmpM.multiplyMatrices(W, pc.mh[i]));
    }
  };
  for (const pc of clumps) {
    if (pc.hide) continue;
    const b = pc.body; _v.set(b.position.x, b.position.y, b.position.z); _q.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
    put(pc, _m2.compose(_v, _q, _s.set(1, 1, 1)));
  }
  if (held) for (const pc of held.pieces) {
    _v.copy(pc.lp).applyQuaternion(held.quat).add(held.pos); _q.copy(held.quat).multiply(pc.lq);
    put(pc, _m2.compose(_v, _q, _s.set(1, 1, 1)));
  }
  for (const t in strandMesh) { strandMesh[t].count = cnt[t]; strandMesh[t].instanceMatrix.needsUpdate = true; }
  headMesh.count = hc; headMesh.instanceMatrix.needsUpdate = true;
  updateHeld();
  updateCust(dt);
  // 湯気
  const bp = bowlG.position; let top = bp.y + RIM_Y; for (const s of sphW) top = Math.max(top, s.y);
  for (const sp of steam) {
    const u = sp.userData; u.t += dt * u.sp; if (u.t > 1) { u.t -= 1; u.x = R(-6, 6); u.z = R(-6, 6); }
    sp.position.set(bp.x + u.x + Math.sin(u.t * 5 + u.z) * 2, top + u.t * 26, bp.z + u.z);
    sp.scale.setScalar(5 + u.t * 12); sp.material.opacity = Math.sin(u.t * Math.PI) * (phase === 'fail' ? .05 : .16);
  }
  // 札
  for (const d of DISHES) {
    _v.set(d.x, KITCH_TOP + 1, d.z - 8).project(camera);
    const show = (phase === 'build') && _v.z < 1;
    d.lab.hidden = !show;
    if (show) { d.lab.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px'; d.lab.style.top = ((1 - _v.y) / 2 * innerHeight) + 'px'; }
  }
  renderer.render(scene, camera);
}

async function fbGet(path, q) { const r = await fetch(FB.databaseURL + '/' + path + '.json' + (q || '')); if (!r.ok) throw new Error('get ' + r.status); return r.json(); }
async function fbPut(path, val, a) { const r = await fetch(FB.databaseURL + '/' + path + '.json?auth=' + encodeURIComponent(a.token), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) }); if (!r.ok) throw new Error('put ' + r.status); return r.json(); }

function encRec() {
  const q = v => Math.round(v * 10), w = v => Math.round(v * 1000);
  const P = clumps.map(pc => [TIDX[pc.type], pc.grab, Math.round(pc.tm * 100), ...pc.s1.slice(0, 3).map(q), ...pc.s1.slice(3).map(w), ...pc.s2.slice(0, 3).map(q), ...pc.s2.slice(3).map(w)].join(','));
  return [VER, P.join(';'), rec.carry.map(v => Math.round(v * 1000)).join(',')].join('|');
}
function decRec(str) {
  const [v, ps, cs] = str.split('|');
  const pieces = (ps ? ps.split(';') : []).map(t => {
    const a = t.split(',').map(Number);
    const q = i => a[i] / 10, w = i => a[i] / 1000;
    return { type: TNAME[a[0]] || 'mid', grab: a[1], tm: a[2] / 100, s1: [q(3), q(4), q(5), w(6), w(7), w(8), w(9)], s2: [q(10), q(11), q(12), w(13), w(14), w(15), w(16)] };
  });
  return { v: +v, pieces, carry: (cs ? cs.split(',') : []).map(x => +x / 1000) };
}

let rankKind = 'day', rankFrom = 'title', resultMode = 'mine';
const rankCache = {};

  rankCache[kind] = { list, at: Date.now() }; return list;
}
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function showRank(kind, from) {

$('#tabDay').onclick = () => showRank('day');

/* ===================== 再生 ===================== */
let rp = null;
async function playReplay(entry, kind) {
  const ol = $('#rlist');
  let d;
  try {
    const r = await fbGet(kind === 'day' ? DBP + '/dreplays/' + dayKey() + '/' + entry.u : DBP + '/replays/' + entry.u);
    if (!r || !r.r) throw new Error('none');
    d = decRec(r.r);
  } catch (e) { ol.insertAdjacentHTML('afterbegin', '<li class="rempty">この盛り方は再生できませんでした</li>'); return; }
  startReplay(d, entry);
}
function startReplay(d, entry) {
  clearScene(); resetCust();
  phase = 'replay'; camGoal = 'build';
  $('#rank').hidden = true; $('#result').hidden = true; $('#title').hidden = true;
  $('#hud').hidden = false; $('#bar').hidden = true; $('#rpBar').hidden = false;
  setHint(entry.n + ' さんの盛り方');
  const grabs = [...new Set(d.pieces.map(p => p.grab))].sort((a, b) => a - b);
  const gt = {}; grabs.forEach(g => { gt[g] = Math.min(...d.pieces.filter(p => p.grab === g).map(p => p.tm)); });
  const Tg = {}; let t = .5;
  grabs.forEach((g, i) => { Tg[g] = t; const nx = grabs[i + 1]; t += nx === undefined ? 0 : clamp((gt[nx] - gt[g]) * .5, .16, .45); });
  for (const p of d.pieces) {
    const pc = makePiece(p.type);
    pc.body = { position: new CANNON.Vec3(), quaternion: new CANNON.Quaternion(), velocity: new CANNON.Vec3() };
    pc.hide = true; pc.rp = p; pc.T0 = Tg[p.grab]; clumps.push(pc);
  }
  rp = { t: 0, buildEnd: t + .8, carry: d.carry.length ? d.carry : [0, 1], entry, done: false };
  rp.carryDur = rp.carry.length / 15;
}
const _rq1 = new THREE.Quaternion(), _rq2 = new THREE.Quaternion();
function setPiece(pc, base, a, b, e) {
  const B = pc.body;
  B.position.set(base.x + a[0] + (b ? (b[0] - a[0]) * e : 0), base.y + a[1] + (b ? (b[1] - a[1]) * e : 0), base.z + a[2] + (b ? (b[2] - a[2]) * e : 0));
  _rq1.set(a[3], a[4], a[5], a[6]).normalize();
  if (b) _rq1.slerp(_rq2.set(b[3], b[4], b[5], b[6]).normalize(), e);
  B.quaternion.set(_rq1.x, _rq1.y, _rq1.z, _rq1.w);
}
function updateReplay(dt) {
  if (!rp) return;
  rp.t += dt; const t = rp.t;
  const base = new THREE.Vector3();
  if (t < rp.buildEnd) {
    for (const pc of clumps) {
      if (t < pc.T0) continue;
      if (pc.hide) { pc.hide = false; if (t - pc.T0 < .1) sfxDrop(); }
      const e = clamp((t - pc.T0) / .25, 0, 1);
      setPiece(pc, base.set(0, (1 - e) * (1 - e) * 7, 0), pc.rp.s1);
    }
  } else if (t < rp.buildEnd + rp.carryDur) {
    camGoal = 'carry';
    const k = (t - rp.buildEnd) * 15, i = Math.floor(k), f = k - i;
    const a = rp.carry[Math.min(i, rp.carry.length - 1)], b = rp.carry[Math.min(i + 1, rp.carry.length - 1)];
    base.copy(path.getPointAt(clamp(a + (b - a) * f, 0, 1)));
    for (const pc of clumps) { pc.hide = false; setPiece(pc, base, pc.rp.s1); }
  } else {
    base.copy(path.getPointAt(1));
    const e = clamp((t - rp.buildEnd - rp.carryDur) / .6, 0, 1);
    for (const pc of clumps) { pc.hide = false; setPiece(pc, base, pc.rp.s1, pc.rp.s2, e); }
    if (e >= 1 && !rp.done) {
      rp.done = true; cust.state = 'happy'; cust.t = 0; sfxThump(.6);
      const en = rp.entry;
      setTimeout(() => { if (phase === 'replay' && rp && rp.entry === en) showReplayEnd(en); }, 1500);
    }
  }
  bowlBody.position.set(base.x, base.y, base.z);
  const m = measure();
  $('#sh').innerHTML = `${m.h.toFixed(1)}<small>cm</small>`;
  $('#sw').innerHTML = `${Math.round(m.g)}<small>g</small>`;
  $('#ss').textContent = m.score.toLocaleString();
}
function showReplayEnd(en) {

  $('#resCard').classList.remove('fail');

  $('#resScore').innerHTML = `${en.s.toLocaleString()}<small>点</small>`;
  $('#resNote').textContent = '';

  $('#result').hidden = false; resultMode = 'replay'; rankFrom = 'replay';
}

/* 確認用 */
window.__moya = {
  get phase() { return phase; }, measure, clumps, world, bowlBody, carry, startGame,
  drop(type, tl, f, x, z) { const h = newHeld(type, tl); growHeld(h, Math.ceil(h.nmax * f)); cacheSpheres(); h.pos.set(x, topAt(x, z, h.r) + h.half + .6, z); dropHeld(h); cacheSpheres(); return h; },
  sim(sec) { const n = Math.round(sec * 90); for (let i = 0; i < n; i++) { world.step(1 / 90); cacheSpheres(); logic(1 / 90); } },
  serve() { $('#serve').disabled = false; $('#serve').onclick(); },
  view(v) { camGoal = v; },
  pause(b) { paused = b; },
  get final() { return final; },
  replayLocal() { startReplay(decRec(final.rec), { n: 'テスト', s: final.score, h: Math.round(final.h * 10), g: Math.round(final.g) }); },
  topAt(x, z) { cacheSpheres(); return topAt(x, z, 2); },
  scr(x, y, z) { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; },
  snap(n = 40) { for (let i = 0; i < n; i++) { cacheSpheres(); render(1 / 30); } },
  click(id) { document.getElementById(id).click(); },
};
